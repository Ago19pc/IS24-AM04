<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Codex Naturalis was designed on Windows (Segoe UI + Constantia), whose fonts cannot be
  redistributed. Free stand-ins, so the layout looks like the original:
    Selawik  Microsoft's open-source font with the same metrics as Segoe UI -> default sans
    Caladea  free serif in place of Constantia. JavaFX looks fonts up by full name, so
             Caladea Regular is also exposed under the name "Constantia" (fontconfig only,
             the font file is untouched).
  Processed before Debian's 60-latin.conf so these preferences win.
-->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Selawik</family></prefer>
  </alias>
  <alias binding="same">
    <family>Constantia</family>
    <prefer><family>Caladea</family></prefer>
  </alias>
  <match target="scan">
    <test name="family"><string>Caladea</string></test>
    <test name="style"><string>Regular</string></test>
    <edit name="fullname" mode="prepend"><string>Constantia</string></edit>
    <edit name="family" mode="prepend"><string>Constantia</string></edit>
  </match>
</fontconfig>
